services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mind_ia-api:latest
    container_name: mind-ia-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3333
      API_PORT: 3333
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:5173}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3333}
      DATABASE_URL: postgresql://operix:${POSTGRES_PASSWORD:-operix}@postgres:5432/operix_mind
      REDIS_URL: redis://redis:6379
    ports:
      - "3333:3333"
    volumes:
      - ./storage:/app/storage
      - ./backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3333/health/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mind_internal

  postgres:
    image: postgres:16-alpine
    container_name: mind-ia-postgres
    environment:
      POSTGRES_USER: operix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-operix}
      POSTGRES_DB: operix_mind
    volumes:
      - mind_ia_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operix -d operix_mind"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mind_internal

  redis:
    image: redis:7-alpine
    container_name: mind-ia-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mind_internal

volumes:
  mind_ia_postgres:

networks:
  mind_internal:
    driver: bridge
