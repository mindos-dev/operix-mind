services:
  api:
    build: .
    container_name: operix-mind-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3333:3333"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3333
      API_PORT: 3333
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://operix:operix@postgres:5432/operix_mind
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-for-local-use}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      LOG_LEVEL: info
      ENABLE_PRETTY_LOGS: "false"
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: operix-mind-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: operix
      POSTGRES_PASSWORD: operix
      POSTGRES_DB: operix_mind
    volumes:
      - operix_mind_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operix -d operix_mind"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: operix-mind-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  operix_mind_postgres:
